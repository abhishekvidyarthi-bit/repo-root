name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files (sanity check)
        run: ls -l

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 3.26.209.28 >> ~/.ssh/known_hosts

      - name: Deploy to private EC2 via bastion
        run: |
          # Copy file from GitHub runner to bastion
          scp index.html ec2-user@<BASTION_PUBLIC_IP>:/home/ec2-user/index.html

          # SSH into bastion and deploy to private EC2
          ssh ec2-user@<BASTION_PUBLIC_IP> << 'EOF'
            scp /home/ec2-user/index.html ec2-user@<PRIVATE_EC2_PRIVATE_IP>:/tmp/index.html
            ssh ec2-user@<PRIVATE_EC2_PRIVATE_IP> "
              sudo mv /tmp/index.html /usr/share/nginx/html/index.html
              sudo systemctl restart nginx
            "
          EOF
