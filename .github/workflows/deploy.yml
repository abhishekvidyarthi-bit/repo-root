name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files (sanity check)
        run: ls -l
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 3.26.209.28 >> ~/.ssh/known_hosts

      - name: Deploy to private EC2 via bastion
        run: |
          ssh ec2-user@3.26.209.28 << 'EOF'
            scp /home/ec2-user/index.html ec2-user@10.0.2.118:/tmp/index.html
            ssh ec2-user@10.0.2.118 "
              sudo mv /tmp/index.html /usr/share/nginx/html/index.html
              sudo systemctl restart nginx
            "
          EOF
